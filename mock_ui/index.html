<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HRMS SRS interactive mock flow" />
    <title>Adhithiya HRMS — Mock Flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#dashboard" data-view="dashboard"><span class="brand-mark">✦</span><span><strong>Adhithiya</strong><small>People, payroll & performance</small></span></a>
        <div class="role-picker"><span>Viewing as</span><select id="roleSelect"><option value="super">Super User</option><option value="sub">HR Sub-User</option><option value="employee">Employee</option></select></div>
        <nav id="mainNav" aria-label="Main navigation"></nav>
        <div class="sidebar-help"><span>✦</span><b>Need help?</b><small>See your HR administrator</small></div>
      </aside>
      <main class="main">
        <header class="topbar"><button class="icon-btn mobile-menu" id="menuBtn" aria-label="Open menu">☰</button><div class="crumb"><strong id="pageTitle">Dashboard</strong><span id="pageSubtitle">A clear view of your workday</span></div><div class="top-actions"><label class="search"><span>⌕</span><input id="globalSearch" placeholder="Search people, modules…" /></label><button class="icon-btn" id="notifyBtn" aria-label="Notifications">♧<i id="notifyCount">4</i></button><button class="profile" id="profileBtn"><span class="avatar">AA</span><span><b id="profileName">Ayon Ahmed</b><small id="profileRole">Super User</small></span><em>⌄</em></button></div></header>
        <section id="view" class="view" tabindex="-1"></section>
      </main>
    </div>
    <div class="drawer" id="notificationDrawer"><div class="drawer-head"><div><small>NOTIFICATIONS</small><h2>Stay updated</h2></div><button class="icon-btn" data-close="notificationDrawer">×</button></div><div id="notificationList"></div><button class="text-button" id="markRead">Mark all as read</button></div>
    <div class="modal-backdrop" id="modalBackdrop"></div><div class="modal" id="modal" role="dialog" aria-modal="true"></div>
    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
  </body>
</html>
